<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculateur de Prêt - Salaam African Bank Djibouti</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: linear-gradient(to bottom, #0B72B9, #085B94);
            padding: 20px 20px 40px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card {
            background: white;
            width: 92%;
            max-width: 450px;
            margin-top: -25px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            color: #333;
            margin: 0 0 5px;
            text-align: center;
        }

        .subtext {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-bottom: 30px;
        }

        .slider-section { margin-bottom: 25px; }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            font-size: 14px;
            color: #444;
        }

        .brand-text { color: #0B72B9; font-weight: bold; }

        input[type=range] {
            width: 100%;
            accent-color: #0B72B9;
            margin: 15px 0;
            height: 6px;
        }

        .slider-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #bbb;
        }

        .result-container {
            background: #f4f8fb;
            border: 1px solid #e1ebf5;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 25px 0;
        }

        .result-value {
            color: #1B8A43;
            font-size: 32px;
            font-weight: bold;
            margin: 0;
        }

        .btn-apply {
            background: linear-gradient(to right, #1B8A43, #23ad54);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-apply:active {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #ccc;
            margin: 30px 0;
        }
    </style>
</head>

<body>

<div class="app-header">
    <span>Salaam African Bank</span>
    <span>☰</span>
</div>

<div class="card">
    <h2>Obtenez un Prêt Rapide</h2>
    <div class="subtext">Approbation rapide • Taux compétitifs • Durées flexibles</div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Montant du Prêt</span>
            <span id="valAmt" class="brand-text">100,000 DJF</span>
        </div>
        <input type="range" id="amt" min="20000" max="500000" step="10000" value="100000">
        <div class="slider-footer"><span>20,000 DJF</span><span>500,000 DJF</span></div>
    </div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Durée du Prêt</span>
            <span id="valDur" class="brand-text">12 mois</span>
        </div>
        <input type="range" id="dur" min="6" max="60" step="6" value="12">
        <div class="slider-footer"><span>6 mois</span><span>60 mois</span></div>
    </div>

    <div class="result-container">
        <p style="margin:0; font-size:14px; color:#666">Paiement Mensuel</p>
        <p id="monthly" class="result-value">9,833.33 DJF</p>
    </div>

    <button class="btn-apply" onclick="goToPage2()">DEMANDER MAINTENANT</button>
</div>

<div class="footer">© 2026 Salaam African Bank Djibouti</div>

<script>
    function update() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        const amount = Number(amtEl.value) || 0;
        const duration = Number(durEl.value) || 1;

        document.getElementById('valAmt').innerText = `${amount.toLocaleString()} DJF`;
        document.getElementById('valDur').innerText = `${duration} mois`;

        const monthly = (amount * 1.18) / duration;
        document.getElementById('monthly').innerText = `${monthly.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} DJF`;
    }

    function goToPage2() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        localStorage.setItem('amount', amtEl.value);
        localStorage.setItem('loanDuration', durEl.value + " Mois");

        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (amtEl) amtEl.addEventListener('input', update);
        if (durEl) durEl.addEventListener('input', update);

        update();
    };
</script>

</body>
</html>
